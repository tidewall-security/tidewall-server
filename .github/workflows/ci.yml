name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: uv sync --group dev
      - run: uv run ruff check app/
      - run: uv run ruff format --check app/
      # Ruff lints neither shell nor Markdown, and the operator runbook
      # publishes both -- a script the test suite executes and two blocks
      # operators paste.
      - run: uv run shellcheck scripts/scan-artifacts.sh
      - run: uv run pymarkdown --config .pymarkdown.json scan docs/operations/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: uv sync --group dev
      - run: uv run mypy app/

  backend-tests:
    name: Backend Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Both ends of requires-python (>=3.12,<3.14). Testing only the floor let
      # a test pass for everyone developing on 3.13 while CI stayed red on
      # 3.12 -- 3.13 dedents docstrings at compile time and 3.12 does not, so a
      # raw __doc__ comparison disagreed between the two supported versions.
      # A version the project claims to support and never runs is a version
      # nobody is checking.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-py${{ matrix.python-version }}-
      - run: uv sync --group dev
      - run: uv run pytest tests/ --cov=app --cov-report=term-missing -q --ignore=tests/e2e

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
