name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          # This workflow manages ~/.cache/uv with actions/cache, so letting
          # setup-uv prune the same directory at teardown is duplicated work
          # whose failure fails the job AFTER every real step has passed. The
          # contract job went red exactly that way, with all thirteen of its
          # steps green.
          prune-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: uv sync --group dev
      # `.`, not `app/`. Scoped to app/ this job reported a clean repo while
      # 193 of its 275 Python files -- every test, every migration, seed_data
      # and bench -- were never looked at, and two migrations sat on main
      # carrying a format ruff rejects.
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Ruff lints neither shell nor Markdown, and the operator runbook
      # publishes both -- a script the test suite executes and two blocks
      # operators paste.
      - run: uv run shellcheck scripts/scan-artifacts.sh
      - run: uv run pymarkdown --config .pymarkdown.json scan docs/operations/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          # This workflow manages ~/.cache/uv with actions/cache, so letting
          # setup-uv prune the same directory at teardown is duplicated work
          # whose failure fails the job AFTER every real step has passed. The
          # contract job went red exactly that way, with all thirteen of its
          # steps green.
          prune-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: uv sync --group dev
      - run: uv run mypy app/

  backend-tests:
    name: Backend Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Both ends of requires-python (>=3.12,<3.14). Testing only the floor let
      # a test pass for everyone developing on 3.13 while CI stayed red on
      # 3.12 -- 3.13 dedents docstrings at compile time and 3.12 does not, so a
      # raw __doc__ comparison disagreed between the two supported versions.
      # A version the project claims to support and never runs is a version
      # nobody is checking.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          # This workflow manages ~/.cache/uv with actions/cache, so letting
          # setup-uv prune the same directory at teardown is duplicated work
          # whose failure fails the job AFTER every real step has passed. The
          # contract job went red exactly that way, with all thirteen of its
          # steps green.
          prune-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-py${{ matrix.python-version }}-
      - run: uv sync --group dev
      - run: uv run pytest tests/ --cov=app --cov-report=term-missing -q --ignore=tests/e2e

  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: uv sync --group dev --group e2e
      - run: uv run playwright install --with-deps chromium
      # Both suites ALWAYS run. The first is deliberately red while the
      # expected-failure manifest is non-empty, and a failing step stops later
      # steps -- so using it as control flow would remove the browser canary
      # from the gate for exactly as long as the gate is red.
      #
      # --ignore=tests/release/browser is load-bearing: `pytest tests/release`
      # recursively collects the browser subtree and then deselects it under
      # the default -m 'not e2e', which would contradict the deselected == 0
      # rule below and make the gate permanently un-greenable. The two
      # commands PARTITION their domains.
      - id: release_suite
        continue-on-error: true
        run: >-
          uv run pytest tests/release --ignore=tests/release/browser
          -q -p no:randomly --junitxml=release.xml
          --release-counts=release-counts.json
          --release-signatures=release-signatures.json
      - id: browser_canary
        continue-on-error: true
        run: >-
          uv run pytest tests/release/browser -q -m e2e -o addopts=''
          --junitxml=browser.xml --release-counts=browser-counts.json
          --release-signatures=browser-signatures.json
      # The ONLY step that decides the job. JUnit XML cannot carry a
      # deselection count, so the counts files are passed alongside it.
      # Declared counts come from the checked-in tests/release/declared_counts.json,
      # NOT from what this run happened to select -- otherwise the
      # selected == declared comparison is necessarily true.
      - run: >-
          uv run python tests/release/gate_report.py
          release.xml release-counts.json
          browser.xml browser-counts.json
          release-signatures.json browser-signatures.json

  mutation-step:
    name: Out-Of-Tree Mutation Step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      # Runs the suite unmutated, checks it reproduces the recorded baseline
      # EXACTLY, applies the named edit, proves it applied, runs again, and
      # requires the delta to be exactly the predeclared signature and count.
      # It never reads an exit code: while the baseline is red every run exits
      # non-zero, so an exit code carries no information.
      - run: uv run python tests/release/run_mutation_step.py

  manifest-empty:
    name: Expected-Failure Manifest Is Empty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      # A STANDALONE required step, landed independently of the deferred
      # publish decision. Asserting the manifest is empty is NOT the same as
      # gating publication on it, and this repository does not claim that
      # release-gate failures block release until a publish job exists that
      # `needs: release-gate`.
      - run: uv run python tests/release/manifest_empty.py
  contract:
    name: Contract (extension against this server)
    runs-on: ubuntu-latest
    # Here rather than in the extension's CI, for two reasons.
    #
    # Cost: this job already installs the server's Python dependencies, seven of
    # which are heavy ML packages. The extension side is a 1s build. Running it
    # the other way round pays that install on a job that otherwise takes
    # seconds.
    #
    # Attribution: the break this exists to catch happens when the SERVER
    # changes. The extension called an endpoint deleted here and was
    # non-functional for eleven days while its own 288 tests passed -- no
    # extension PR was at fault, so nothing in that repo would have been on the
    # hook. A server PR that removes a route should fail on that PR.
    steps:
      - uses: actions/checkout@v4
        with:
          path: server
      - uses: actions/checkout@v4
        with:
          repository: tidewall-security/tidewall-browser-extension
          path: extension
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          # This workflow manages ~/.cache/uv with actions/cache, so letting
          # setup-uv prune the same directory at teardown is duplicated work
          # whose failure fails the job AFTER every real step has passed. The
          # contract job went red exactly that way, with all thirteen of its
          # steps green.
          prune-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py3.12-${{ hashFiles('server/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-py3.12-

      - name: Install server
        working-directory: server
        run: uv sync --group dev

      - name: Install and build extension
        working-directory: extension
        run: |
          npm ci
          npm run build

      - name: Start the server
        working-directory: server
        env:
          # PREWARM=false because the contract tests never invoke a detector --
          # loading the models would add minutes to prove nothing.
          DB_URL: sqlite:////tmp/contract.db
          BOOTSTRAP_KEY: ak_ci_contract_bootstrap_key_00000001
          PREWARM: "false"
        run: |
          uv run uvicorn app.main:app --port 8099 > /tmp/server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:8099/health > /dev/null && break
            if [ "$i" = "90" ]; then echo "server did not start"; cat /tmp/server.log; exit 1; fi
            sleep 1
          done

      - name: Seed a policy and a registration token
        working-directory: server
        env:
          # The seed step needs the SAME key the server was bootstrapped with.
          # Omitted here on the first attempt, so it used the default and got a
          # 401 -- which surfaced as a KeyError two lines into the script.
          TIDEWALL_ADMIN_KEY: ak_ci_contract_bootstrap_key_00000001
        run: uv run python ../extension/tests/integration/seed.py

      - name: Client HTTP layer against the running server
        working-directory: extension
        env:
          TIDEWALL_INTEGRATION: "1"
          TIDEWALL_ADMIN_KEY: ak_ci_contract_bootstrap_key_00000001
        run: npx vitest run tests/integration/live-server.test.ts

      - name: The extension itself, in a real browser
        working-directory: extension
        env:
          TIDEWALL_INTEGRATION: "1"
          TIDEWALL_ADMIN_KEY: ak_ci_contract_bootstrap_key_00000001
        run: |
          npx playwright install chromium --with-deps
          xvfb-run --auto-servernum npx playwright test tests/e2e/live-enrolment.spec.ts

      - name: Server log on failure
        if: failure()
        run: cat /tmp/server.log

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
