services:
  tidewall:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./policy.yaml:/app/policy.yaml:ro
      - tidewall-data:/app/data
    environment:
      - POLICY_FILE=/app/policy.yaml
      - DB_URL=sqlite:///data/tidewall.db
      - LOG_LEVEL=info
      # Auth is on by default. Set BOOTSTRAP_KEY to a secret you generate;
      # the server refuses to start without one when no API keys exist.
      - BOOTSTRAP_KEY=${BOOTSTRAP_KEY:?set BOOTSTRAP_KEY to a generated secret}
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  tidewall-data:
