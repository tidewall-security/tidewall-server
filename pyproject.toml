[project]
name = "tidewall-server"
version = "0.1.0"
description = "Open-source AI security guard API server"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Tidewall Security" },
]
keywords = [
    "ai-security",
    "llm-security",
    "prompt-injection",
    "guardrails",
    "fastapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "ff3>=1.0",
    "sentence-transformers>=2.0",
    "transformers>=4.40.0",
    "torch>=2.0",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "detect-secrets>=1.5",
    "spacy>=3.7",
    # Presidio's NER backbone — pinned to a wheel URL because spaCy models
    # are distributed as Python packages, not via PyPI. Without this, fresh
    # `uv sync` produces a broken install (Presidio falls back silently on
    # PII entities). Pinned to 3.8.x because spaCy model versions track the
    # spaCy minor release.
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8,<0.9",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://tidewall.ai"
Repository = "https://github.com/tidewall-security/tidewall-server"
Issues = "https://github.com/tidewall-security/tidewall-server/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["e2e: End-to-end browser tests"]
testpaths = ["tests"]

[tool.hatch.metadata]
# Allow the spaCy NER model to be declared via wheel URL in `dependencies`
# above. spaCy distributes models as Python packages, not via PyPI.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[tool.coverage.run]
source = ["app"]
omit = ["app/static/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
