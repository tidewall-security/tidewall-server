[project]
name = "tidewall-server"
version = "0.1.0"
description = "Open-source AI security guard API server"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Tidewall Security" },
]
keywords = [
    "ai-security",
    "llm-security",
    "prompt-injection",
    "guardrails",
    "fastapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "sentence-transformers>=2.0",
    "transformers>=4.40.0",
    "torch>=2.0",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "detect-secrets>=1.5",
    # Linear-time regex engine. Administrator-supplied patterns are matched
    # against attacker-controlled prompt text, and Python's `re` backtracks:
    # `(a+)+$` against 41 characters runs for over three seconds and does not
    # stop, which takes the guard offline (P0-12). RE2 answers the same input
    # in 0.1ms because it cannot backtrack. Wheels exist for manylinux
    # x86_64/aarch64, macOS and Windows on CPython 3.12/3.13, so this needs no
    # C++ toolchain — but a source build must be treated as a failure, not an
    # undocumented requirement.
    "google-re2>=1.1",
    "spacy>=3.7",
    # Presidio's NER backbone — pinned to a wheel URL because spaCy models
    # are distributed as Python packages, not via PyPI. Without this, fresh
    # `uv sync` produces a broken install (Presidio falls back silently on
    # PII entities). Pinned to 3.8.x because spaCy model versions track the
    # spaCy minor release.
    #
    # The #sha256 fragment makes the download content-addressed. Version
    # pinning alone does not: a GitHub release asset can be replaced, and this
    # is a 382MB artifact that feeds the PII detector, fetched over the network
    # during every clean build. Verified 2026-08-17 at 400,658,291 bytes.
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl#sha256=293e9547a655b25499198ab15a525b05b9407a75f10255e405e8c3854329ab63",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8,<0.9",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
]
# Browser tests, opt-in. Kept out of `dev` because Playwright is irrelevant to
# server work and needs a further ~150MB of browser binaries installed by
# `playwright install`, which pip does not handle. Install with:
#   uv sync --group e2e && uv run playwright install chromium
e2e = [
    "pytest-playwright>=0.7,<0.8",
    # Imported directly by tests/e2e/conftest.py. It was previously satisfied
    # only transitively through a production dependency, which is not a
    # contract a test can rely on.
    "requests>=2.32,<3",
]


[project.urls]
Homepage = "https://tidewall.ai"
Repository = "https://github.com/tidewall-security/tidewall-server"
Issues = "https://github.com/tidewall-security/tidewall-server/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# The default run is backend-only. The e2e marker was already declared here but
# nothing deselected it, so these tests were collected on every run and emitted
# 12 errors — and that constant noise is how the fact that none of them had
# ever actually executed went unnoticed.
addopts = "-m 'not e2e'"
markers = ["e2e: browser tests; need the e2e group and `playwright install chromium`"]
testpaths = ["tests"]

[tool.hatch.metadata]
# Allow the spaCy NER model to be declared via wheel URL in `dependencies`
# above. spaCy distributes models as Python packages, not via PyPI.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[tool.coverage.run]
source = ["app"]
omit = ["app/static/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
