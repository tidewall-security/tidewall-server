name: "default_policy"
report_only: false

# Raw prompt capture. Off by default: Tidewall stores what was detected, not
# the prompt itself. Turning this on retains full prompts, gated behind a
# separate grant, with no expiry unless you set one.
raw_content_enabled: false
raw_content_retention_days: null

detectors:
  # FIRST, and enabled by default, because without it every detector below
  # scans text the model will not receive. Instructions encoded in the Unicode
  # Tag Block are invisible in every font and fully readable to a model: the
  # injection classifier blocks them as plain text and saw nothing at all when
  # they were smuggled behind innocent cover text.
  #
  # `redact` rather than `block`: the hidden characters are stripped and the
  # user's visible prompt goes through untouched, so a legitimate request is
  # not refused for carrying something the sender could not see. What was
  # hidden is decoded into the evidence either way.
  hidden_instructions:
    enabled: true
    action: redact

  malicious_prompt:
    enabled: true
    action: block
    threshold: 0.9
    # Ungated and Apache-2.0, so a clean build needs no HF credentials. The
    # previous default was gated: manual and paired with a tokenizer from a
    # different model. Pinned by revision so the artifact cannot move.
    model: protectai/deberta-v3-base-prompt-injection-v2
    revision: 90c9989b1a342275dd0d1a95aad283c04e075671
    # This model labels its classes SAFE / INJECTION rather than LABEL_0 /
    # LABEL_1. The value is resolved through the model's own id2label at
    # construction, so 1 would work too — but naming the label the model
    # actually owns is what makes the config readable.
    injection_label: INJECTION

  confidential_and_pii_entity:
    enabled: true
    action: redact

  secret_and_key_entity:
    enabled: true
    action: redact

  topic:
    enabled: true
    action: report
    topics:
      - violence
      - drugs
      - hate_speech
      - self-harm
      - weapons
    threshold: 0.7
    toxicity_threshold: 0.7

  language:
    enabled: true
    action: report
    valid_languages:
      - en

  code:
    enabled: true
    action: report
    languages:
      - Python
      - JavaScript
      - Java
      - Go

  competitors:
    enabled: false
    action: report
    competitors: []

  custom_entity:
    enabled: false
    action: redact
    patterns: []

  malicious_entity:
    enabled: true
    action: report

  emoji:
    enabled: true
    action: report

  # Structural checks on an MCP tool listing: names that duplicate or closely
  # resemble each other. Runs on tool_listing only.
  #
  # `report`, not `block`, and the threshold is 0.95 rather than the code
  # default of 0.8. Both come from measurement, and neither should be raised
  # without repeating it.
  #
  # Name similarity cannot separate an attack from an ordinary naming scheme,
  # because the two overlap: `transfer_funds`/`transfer_fund` scores 0.96 and
  # is an impersonation, while `calculate_distance`/`calculate_distance_km`
  # scores 0.92 and is a real pair of tools. Across 671 tool names from 103
  # public MCP servers, the shipped 0.8 flags 7% of all tools -- among them
  # `excel_add_sheet`/`excel_read_sheet` and
  # `clear_sql_database`/`create_sql_database`. At 0.95 it flags none of them,
  # and still catches exact duplicates and a dropped character.
  #
  # Blocking would remove BOTH tools in a flagged pair, since nothing here can
  # tell which one is the impostor. For a signal this ambiguous that is a worse
  # outcome than surfacing it, so it reports.
  #
  # Note also what this cannot see: tool shadowing is usually a *second* server
  # registering a name that collides with a first one's, and a check that
  # compares names within a single listing never observes that.
  mcp_validation:
    enabled: true
    action: report
    similarity_threshold: 0.95

# Per-surface detector overrides, merged over `detectors` for the named event
# type. An event type absent here uses `detectors` unchanged.
#
# The injection classifier ran at one threshold everywhere, and its false
# positives concentrate almost entirely on tool_output -- measured at 211 of
# 221 benign false-positive events on a 303-session corpus. Raising the
# threshold only where the cost lands keeps detection while removing eight
# benign sessions from the blocked set: same 18 of 42 sessions caught, 72 of
# 261 benign blocked rather than 80.
#
# These values are an operating point selected against that corpus. They are
# not a law, and a deployment with different traffic should re-measure.
event_overrides:
  output:
    malicious_prompt:
      threshold: 0.975
  tool_output:
    malicious_prompt:
      threshold: 0.98
  # Tool definitions are scanned field by field, and a tool description is an
  # imperative sentence by nature -- the same grammar the classifier is trained
  # to treat as an instruction. Measured over 849 descriptions reconstructed
  # from 103 public MCP servers: 3 flag at 0.9, 1 at 0.99, while an outright
  # injection in a description scores 0.999 and is still caught here.
  tool_listing:
    malicious_prompt:
      threshold: 0.99
